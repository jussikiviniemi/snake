<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cage Match: Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #3a0d0d, #0d0505 70%);
    color: #f5e6c4;
    font-family: Georgia, "Times New Roman", serif;
    user-select: none;
  }
  .marquee {
    margin: 0 0 6px;
    font-size: clamp(26px, 6vmin, 40px);
    letter-spacing: 3px;
    color: #ffcc33;
    text-shadow: 0 0 8px #ff9900, 0 0 2px #fff;
  }
  .tagline { margin: 0 0 10px; color: #c9a86a; font-style: italic; font-size: 14px; }
  .hud {
    width: min(90vmin, 480px);
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 18px;
  }
  .wrap { position: relative; }
  canvas {
    display: block;
    width: min(90vmin, 480px);
    height: min(90vmin, 480px);
    background: #1a0f0a;
    border: 4px solid #b8860b;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(255, 170, 0, 0.35);
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(10, 4, 2, 0.75);
    border-radius: 6px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0 0 8px; font-size: 34px; color: #ffcc33; }
  .overlay p { margin: 4px 0; color: #e0cfa8; }
  .toast {
    position: absolute;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    padding: 6px 14px;
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid #b8860b;
    border-radius: 4px;
    color: #ffcc33;
    font-size: 15px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast small { display: block; color: #c9a86a; font-style: italic; }
  .bees-banner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(30px, 9vmin, 56px);
    font-weight: bold;
    color: #ffd700;
    text-shadow: 3px 3px 0 #000, 0 0 12px #ff8800;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .bees-banner.show { opacity: 1; animation: shake 0.12s infinite; }
  @keyframes shake {
    0% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(-4px, 2px) rotate(-2deg); }
    50% { transform: translate(3px, -3px) rotate(2deg); }
    75% { transform: translate(-2px, 3px) rotate(-1deg); }
  }
  .help { margin-top: 10px; color: #9c8256; font-size: 14px; text-align: center; }
</style>
</head>
<body>
  <h2 class="marquee">CAGE MATCH: SNAKE</h2>
  <p class="tagline">Eat the props of the classics. Beware the bees.</p>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <div class="wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="toast" id="toast"></div>
    <div class="bees-banner" id="bees">NOT THE BEES!</div>
    <div class="overlay" id="overlay">
      <h1 id="title">Cage Match</h1>
      <p id="message">Press Space or tap to start</p>
      <p id="sub">🐝 = 3 points… and a scream. Sound on!</p>
    </div>
  </div>
  <div class="help">Arrow keys / WASD to move · Space to pause · swipe on touch screens</div>

<script>
  const GRID = 20;
  const CELL = 480 / GRID;
  const START_SPEED = 120; // ms per step
  const MIN_SPEED = 55;
  const BEE_CHANCE = 0.2;

  // Props from the classics. Eating one shows its movie.
  const PROPS = [
    { emoji: '📜', movie: 'National Treasure (2004)', line: 'Declaration of Independence: acquired' },
    { emoji: '🐰', movie: 'Con Air (1997)', line: 'The bunny is back in the box' },
    { emoji: '🚗', movie: 'Gone in 60 Seconds (2000)', line: 'Eleanor: boosted' },
    { emoji: '💀', movie: 'Ghost Rider (2007)', line: 'Skull: fully flaming' },
    { emoji: '🎭', movie: 'Face/Off (1997)', line: 'Face: off' },
    { emoji: '🧪', movie: 'The Rock (1996)', line: 'Green goo: secured' },
    { emoji: '👶', movie: 'Raising Arizona (1987)', line: 'Huggies run: complete' },
    { emoji: '🕶️', movie: 'Wild at Heart (1990)', line: 'Snakeskin jacket energy' },
  ];
  const BEES = { emoji: '🐝', movie: 'The Wicker Man (2006)', bees: true };

  const GAME_OVER_LINES = [
    'You got Caged.',
    'Gone in 60 seconds. Or less.',
    'Put the snake back in the box.',
    'Face… off the board.',
  ];

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');
  const subEl = document.getElementById('sub');
  const toastEl = document.getElementById('toast');
  const beesEl = document.getElementById('bees');

  let snake, dir, queue, food, score, speed, state, timer, toastTimer, beesTimer;
  let swarm = [];
  let best = Number(localStorage.getItem('cage-snake-best')) || 0;
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    speed = START_SPEED;
    scoreEl.textContent = 0;
    swarm = [];
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    if (!free.length) { food = null; return; }
    const spot = free[Math.floor(Math.random() * free.length)];
    const prop = Math.random() < BEE_CHANCE ? BEES : PROPS[Math.floor(Math.random() * PROPS.length)];
    food = { ...spot, prop };
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = food && head.x === food.x && head.y === food.y;
    // The tail moves away this step unless we eat, so it's safe to move into it.
    const body = eating ? snake : snake.slice(0, -1);

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        body.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (eating) {
      const prop = food.prop;
      if (prop.bees) {
        score += 3;
        notTheBees();
      } else {
        score++;
        showToast(prop.emoji + ' ' + prop.line, prop.movie);
      }
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - 3);
      placeFood();
      if (!food) return gameOver(true);
    } else {
      snake.pop();
    }
    timer = setTimeout(step, speed);
  }

  // --- The bees ---------------------------------------------------------

  let audio;
  function notTheBees() {
    beesEl.classList.add('show');
    clearTimeout(beesTimer);
    beesTimer = setTimeout(() => beesEl.classList.remove('show'), 2200);
    showToast('🐝 The Wicker Man (2006)', 'Oh no, not the bees!');

    for (let i = 0; i < 40; i++) {
      swarm.push({
        x: -20 - Math.random() * 200,
        y: Math.random() * canvas.height,
        vx: 3 + Math.random() * 4,
        phase: Math.random() * Math.PI * 2,
        size: 14 + Math.random() * 14,
      });
    }

    buzz();
    scream();
  }

  // A buzzing swarm, synthesised with the Web Audio API.
  function buzz() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const now = audio.currentTime;
      const out = audio.createGain();
      out.gain.setValueAtTime(0.0001, now);
      out.gain.exponentialRampToValueAtTime(0.18, now + 0.1);
      out.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
      out.connect(audio.destination);

      [180, 205, 233].forEach(freq => {
        const osc = audio.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        const wobble = audio.createOscillator();
        const wobbleDepth = audio.createGain();
        wobble.frequency.value = 18 + Math.random() * 10;
        wobbleDepth.gain.value = 12;
        wobble.connect(wobbleDepth).connect(osc.frequency);
        osc.connect(out);
        osc.start(now);
        wobble.start(now);
        osc.stop(now + 2.3);
        wobble.stop(now + 2.3);
      });
    } catch (e) { /* no audio available */ }
  }

  // The scream, via the browser's built-in text-to-speech voice.
  function scream() {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('Oh no! Not the bees! The bees! The bees! Aaaaaaah!');
    u.rate = 1.15;
    u.pitch = 1.4;
    u.volume = 1;
    speechSynthesis.speak(u);
  }

  // --- Drawing ------------------------------------------------------------

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // film-strip checkerboard
    ctx.fillStyle = '#24150d';
    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        if ((x + y) % 2) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    if (food) {
      ctx.font = `${CELL * 0.85}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(food.prop.emoji, food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 1);
    }

    // the snake: a gold-and-crimson snakeskin jacket
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#ffcc33' : (i % 2 ? '#b8860b' : '#8b1a1a');
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
    });
    drawSunglasses(snake[0]);

    drawSwarm();
    requestAnimationFrame(render);
  }

  function drawSunglasses(h) {
    const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
    // perpendicular to travel direction
    const px = -dir.y, py = dir.x;
    const fx = dir.x * 3, fy = dir.y * 3;
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx + fx + px * 5, cy + fy + py * 5, 4, 0, Math.PI * 2);
    ctx.arc(cx + fx - px * 5, cy + fy - py * 5, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + fx + px * 5, cy + fy + py * 5);
    ctx.lineTo(cx + fx - px * 5, cy + fy - py * 5);
    ctx.stroke();
  }

  function drawSwarm() {
    if (!swarm.length) return;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    swarm.forEach(b => {
      b.x += b.vx;
      b.phase += 0.3;
      ctx.font = `${b.size}px serif`;
      ctx.fillText('🐝', b.x, b.y + Math.sin(b.phase) * 8);
    });
    swarm = swarm.filter(b => b.x < canvas.width + 40);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function showToast(text, sub) {
    toastEl.innerHTML = '';
    toastEl.append(text);
    const small = document.createElement('small');
    small.textContent = sub;
    toastEl.append(small);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // --- Game state -----------------------------------------------------------

  function start() {
    if (state === 'over' || !state) reset();
    state = 'running';
    overlay.classList.add('hidden');
    timer = setTimeout(step, speed);
  }

  function pause() {
    state = 'paused';
    clearTimeout(timer);
    showOverlay('Paused', 'Press Space or tap to continue', '');
  }

  function gameOver(won = false) {
    state = 'over';
    clearTimeout(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('cage-snake-best', best);
      bestEl.textContent = best;
    }
    const line = GAME_OVER_LINES[Math.floor(Math.random() * GAME_OVER_LINES.length)];
    showOverlay(won ? 'National Treasure!' : 'Game over', won ? 'You filled the whole board.' : line,
      `Score: ${score} · Press Space or tap to play again`);
  }

  function showOverlay(title, msg, sub) {
    titleEl.textContent = title;
    messageEl.textContent = msg;
    subEl.textContent = sub;
    overlay.classList.remove('hidden');
  }

  function turn(nx, ny) {
    if (state !== 'running') return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    // ignore reversing into yourself and duplicate inputs
    if ((nx === -last.x && ny === -last.y) || (nx === last.x && ny === last.y)) return;
    if (queue.length < 3) queue.push({ x: nx, y: ny });
  }

  function toggle() {
    state === 'running' ? pause() : start();
  }

  const KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      toggle();
    } else if (KEYS[e.key]) {
      e.preventDefault();
      if (state !== 'running' && state !== 'paused') start();
      turn(...KEYS[e.key]);
    }
  });

  // touch: swipe to turn, tap to start/pause
  let touchStart = null;
  canvas.parentElement.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.parentElement.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return toggle();
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else turn(0, Math.sign(dy));
  });
  overlay.addEventListener('click', toggle);

  reset();
  render();
</script>
</body>
</html>
