<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    user-select: none;
  }
  .hud {
    width: min(90vmin, 480px);
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 18px;
  }
  .wrap { position: relative; }
  canvas {
    display: block;
    width: min(90vmin, 480px);
    height: min(90vmin, 480px);
    background: #1b1b1b;
    border: 2px solid #333;
    border-radius: 6px;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 6px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0 0 8px; font-size: 36px; }
  .overlay p { margin: 4px 0; color: #bbb; }
  .help { margin-top: 10px; color: #777; font-size: 14px; }
</style>
</head>
<body>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <div class="wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title">Snake</h1>
      <p id="message">Press Space or tap to start</p>
    </div>
  </div>
  <div class="help">Arrow keys / WASD to move · Space to pause · swipe on touch screens</div>

<script>
  const GRID = 20;
  const CELL = 480 / GRID;
  const START_SPEED = 120; // ms per step
  const MIN_SPEED = 55;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');

  let snake, dir, queue, food, score, speed, state, timer;
  let best = Number(localStorage.getItem('snake-best')) || 0;
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    speed = START_SPEED;
    scoreEl.textContent = 0;
    placeFood();
    draw();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = food && head.x === food.x && head.y === food.y;
    // The tail moves away this step unless we eat, so it's safe to move into it.
    const body = eating ? snake : snake.slice(0, -1);

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        body.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - 3);
      placeFood();
      if (!food) return gameOver(true);
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(step, speed);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // subtle checkerboard
    ctx.fillStyle = '#202020';
    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        if ((x + y) % 2) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    if (food) {
      ctx.fillStyle = '#ff4d4d';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2);
      ctx.fill();
    }

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#7CFC00' : `hsl(110, 70%, ${45 - Math.min(i, 20)}%)`;
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
    });

    // eyes
    const h = snake[0];
    ctx.fillStyle = '#111';
    const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
    const ox = dir.y * 5, oy = dir.x * 5;
    const fx = dir.x * 4, fy = dir.y * 4;
    ctx.beginPath();
    ctx.arc(cx + fx + ox, cy + fy + oy, 2.5, 0, Math.PI * 2);
    ctx.arc(cx + fx - ox, cy + fy - oy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function start() {
    if (state === 'over' || !state) reset();
    state = 'running';
    overlay.classList.add('hidden');
    timer = setTimeout(step, speed);
  }

  function pause() {
    state = 'paused';
    clearTimeout(timer);
    showOverlay('Paused', 'Press Space or tap to continue');
  }

  function gameOver(won = false) {
    state = 'over';
    clearTimeout(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', best);
      bestEl.textContent = best;
    }
    showOverlay(won ? 'You win!' : 'Game over', `Score: ${score} · Press Space or tap to play again`);
  }

  function showOverlay(title, msg) {
    titleEl.textContent = title;
    messageEl.textContent = msg;
    overlay.classList.remove('hidden');
  }

  function turn(nx, ny) {
    if (state !== 'running') return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    // ignore reversing into yourself and duplicate inputs
    if ((nx === -last.x && ny === -last.y) || (nx === last.x && ny === last.y)) return;
    if (queue.length < 3) queue.push({ x: nx, y: ny });
  }

  function toggle() {
    state === 'running' ? pause() : start();
  }

  const KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      toggle();
    } else if (KEYS[e.key]) {
      e.preventDefault();
      if (state !== 'running' && state !== 'paused') start();
      turn(...KEYS[e.key]);
    }
  });

  // touch: swipe to turn, tap to start/pause
  let touchStart = null;
  canvas.parentElement.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.parentElement.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return toggle();
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else turn(0, Math.sign(dy));
  });
  overlay.addEventListener('click', toggle);

  reset();
</script>
</body>
</html>
